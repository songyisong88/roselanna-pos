<header class="demo-bar" id="demoBar">
  <div class="demo-row1">
    <div class="demo-brand"><img src="assets/logo-emblem.svg" alt="" width="26" height="27"><b>ROSELANNA</b></div>
    <span class="demo-badge" title="ข้อมูลทั้งหมดเป็นข้อมูลตัวอย่าง">เดโมตัวอย่าง · ข้อมูลตัวอย่าง</span>
    <label class="role-pick"><span>สิทธิ์ผู้ใช้</span>
      <select id="roleSel" aria-label="เลือกสิทธิ์ผู้ใช้">
        <option value="owner">เจ้าของร้าน</option>
        <option value="manager">ผู้จัดการสาขา</option>
        <option value="cashier">แคชเชียร์</option>
        <option value="therapist">หมอนวด</option>
      </select></label>
  </div>
  <nav class="demo-tabs" id="viewTabs" aria-label="สลับมุมมอง"></nav>
  <div class="demo-note" id="roleNote"></div>
</header>

<main id="stage">
  <section id="view-customer" class="view" hidden></section>
  <section id="view-pos" class="view" hidden></section>
