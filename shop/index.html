<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ROSELANNA — ระบบหลังร้าน POS (พนักงาน · เดโมตัวอย่าง)</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="site-shop">
<header class="demo-bar" id="shopBar" hidden>
  <div class="demo-row1">
    <div class="demo-brand"><img src="../assets/logo-emblem.svg" alt="" width="26" height="27"><b>ROSELANNA</b></div>
    <span class="demo-badge" title="ข้อมูลทั้งหมดเป็นข้อมูลตัวอย่าง">หลังร้าน · ข้อมูลตัวอย่าง</span>
    <div class="role-pick"><span class="who-pill"><svg class="ico" aria-hidden="true"><use href="#i-user"/></svg><span id="whoName"></span></span>
      <button class="btn-ghost sm" id="logoutBtn" type="button">ออกจากระบบ</button></div>
  </div>
  <nav class="demo-tabs" id="viewTabs" aria-label="เมนูหลังร้าน"></nav>
  <div class="demo-note" id="roleNote"></div>
</header>

<main id="stage">
  <section id="view-login" class="view" hidden></section>
  <section id="view-pos" class="view" hidden></section>
  <section id="view-dash" class="view" hidden></section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>

<script src="../js/config.js"></script>
<script src="../js/catalog.js"></script>
<script src="../js/dashboard-calc.js"></script>
<script src="../js/core.js"></script>
<script src="../js/sprite.js"></script>
<script src="../js/store-local.js"></script>
<script src="../js/store-remote.js"></script>
<script src="../js/boot.js"></script>
<script src="../js/pos.js"></script>
<script src="../js/dash.js"></script>
<script src="../js/shop-app.js"></script>
</body>
</html>
